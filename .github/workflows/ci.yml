name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint and build the model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken ruff

      - name: Lint
        run: ruff check .

      - name: Build the model and run a forward pass
        run: |
          python - <<'PY'
          import ast, torch
          src = open("train.py", encoding="utf-8", errors="replace").read()
          keep = [n for n in ast.parse(src).body
                  if isinstance(n, (ast.Import, ast.ImportFrom, ast.ClassDef))]
          ns = {}
          exec(compile(ast.Module(body=keep, type_ignores=[]), "train.py", "exec"), ns)
          model = ns["GPT"](ns["GPTConfig"]())
          n = sum(p.numel() for p in {id(p): p for p in model.parameters()}.values())
          assert n == 27_846_000, f"parameter count changed: {n:,}"
          x = torch.randint(0, 50257, (2, 16))
          logits, loss = model(x, x)
          assert logits.shape == (2, 16, 50257), logits.shape
          assert loss is not None
          print(f"OK - {n:,} parameters, forward pass produces {tuple(logits.shape)}")
          PY
